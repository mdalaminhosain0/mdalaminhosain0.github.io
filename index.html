<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Amin Hossain | Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; color: #333; text-align: center; padding: 20px; }
        .card { background: white; max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 28px; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 16px; line-height: 1.6; margin-bottom: 20px; }
        
        /* Buttons Styling */
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .btn { display: block; color: white; padding: 12px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; font-size: 16px; }
        .btn-fb { background: #0866ff; }
        .btn-fb:hover { background: #0052cc; }
        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { background: #128C7E; }
        
        /* Social Links Styling */
        .social-links { border-top: 1px solid #eee; padding-top: 20px; margin-top: 20px; }
        .social-links a { color: #34495e; margin: 0 10px; text-decoration: none; font-size: 15px; font-weight: bold; }
        .social-links a:hover { color: #0077b5; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Al-Amin Hossain</h1>
        <p>Web Developer & Digital Content Creator</p>
        <p>Welcome to my personal website! Feel free to connect with me for any professional projects or collaborations.</p>
        
        <div class="btn-group">
            <!-- 🔵 Facebook Button -->
            <a href="https://www.facebook.com/mdalaminhosain0" class="btn btn-fb" target="_blank">Connect on Facebook</a>
            
            <!-- 🟢 WhatsApp Button -->
            <a href="https://wa.me" class="btn btn-whatsapp" target="_blank">Chat on WhatsApp</a>
        </div>

        <div class="social-links">
            <a href="https://www.facebook.com/mdalaminhosain0" target="_blank">Facebook</a> | 
            <a href="https://github.com" target="_blank">GitHub</a>
        </div>
    </div>

</body>
</html>
